    { q: "Hva er et agentregister?", a: ["En liste over ansatte", "En oversikt over alle agenter med eier, formål, kilder, tilganger og risiko", "Et register over språkmodeller på markedet", "En logg over chatsamtaler"], c: 1, x: "Registeret gir oversikt og gjør det mulig å styre, følge opp og fase ut agenter." },
    { q: "Hvorfor er løse koblinger viktig?", a: ["For å gjøre løsningene tregere", "For å kunne bytte språkmodell eller verktøy uten å bygge alt på nytt", "For å spare strøm", "For at agenter skal kunne snakke sammen uten kontroll"], c: 1, x: "Teknologien endrer seg raskt. Løse koblinger gir fleksibilitet." },
    { q: "Hvilket problem fant kommunen i eksemplet?", a: ["For få agenter", "Overlappende agenter, utdaterte kilder og agenter uten eier", "At ingen brukte Copilot Studio", "At agentene var for dyre å lage"], c: 1, x: "Uten forvaltning vokser antallet agenter fortere enn kontrollen." }
  ]
},
{
  id: 18, part: 5, min: 4, title: "Gevinstrealisering",
  intro: "Velkommen til den siste delen av løpet: effekt og endring. Gjennom kurset har vi snakket om tid spart, bedre kvalitet og bedre tjenester. Men hvordan vet vi at det faktisk skjer? Det er det gevinstrealisering handler om.",
  explain: `<p>En <strong>gevinst</strong> er en positiv effekt av en endring, for eksempel kortere saksbehandlingstid, færre feil eller mer fornøyde brukere.</p>
<p><strong>Gevinstrealisering</strong> er arbeidet med å sørge for at gevinstene faktisk oppnås, ikke bare loves i en søknad om midler.</p>
<ul><li><strong>Gevinstkart:</strong> viser sammenhengen mellom tiltaket, endringene det krever og gevinstene det skal gi.</li>
<li><strong>Nullpunktsmåling:</strong> mål hvordan det er før du starter, ellers kan du ikke vise forbedringen.</li>
<li><strong>Gevinsteier:</strong> en leder i linjen, ikke i prosjektet, har ansvaret for å hente ut gevinsten.</li>
<li><strong>Oppfølging over tid:</strong> mange gevinster kommer først måneder etter innføring.</li></ul>
<p>DFØ har veiledere og maler for gevinstrealisering i staten, som også er nyttige for kommuner.</p>
<p class="keyline">Spart tid er ikke en gevinst før noen har bestemt hva tiden skal brukes til.</p>`,
  why: [
    "<strong>Prioritering.</strong> Med gevinster i kroner, tid eller kvalitet kan ledelsen velge de tiltakene som gir mest.",
    "<strong>Troverdighet.</strong> KI-satsinger må kunne vise effekt for å få fortsatt finansiering.",
    "<strong>Tid må omdisponeres.</strong> En agent som sparer 10 minutter per sak, gir ingen gevinst hvis tiden forsvinner i andre oppgaver.",
    "<strong>Kvalitative gevinster teller.</strong> Bedre opplevelse for innbyggerne og bedre arbeidsmiljø er også reelle gevinster.",
    "<strong>Produktteam måler kontinuerlig.</strong> Dette knytter an til økt 15. Effekt er det teamet styrer etter."
  ],
  example: `<p>HR-avdelingen fra økt 5 lanserte agenten «Spør HR». Før lansering gjorde de en <strong>nullpunktsmåling</strong>: 600 e-poster i måneden til HR-postkassen, i snitt 8 minutter per svar.</p>
<p>Seks måneder senere var det 350 e-poster i måneden. Det tilsvarer rundt 33 timer i måneden.</p>
<p>HR-direktøren, som var <strong>gevinsteier</strong>, bestemte at tiden skulle brukes på oppfølging av sykefravær. Det var et område de lenge hadde ønsket å prioritere. Gevinsten ble dermed både målbar og synlig.</p>`,
  reflect: "Velg et digitaliseringstiltak hos dere. Ble det gjort en nullpunktsmåling, og vet noen i dag om gevinstene faktisk kom?",
  next: "Gevinster kommer bare når folk faktisk endrer måten de jobber på. Neste økt handler om endringsledelse når KI kommer inn i arbeidshverdagen.",
  quiz: [
    { q: "Hva er en nullpunktsmåling?", a: ["En måling av hvordan det er før tiltaket starter", "En måling av null feil", "En test av internettforbindelsen", "Siste måling i et prosjekt"], c: 0, x: "Uten et utgangspunkt kan du ikke vise hvor mye som er forbedret." },
    { q: "Hvem bør eie gevinstene?", a: ["Leverandøren", "Prosjektlederen", "En leder i linjen som skal hente ut gevinsten", "IT-avdelingen"], c: 2, x: "Gevinstene realiseres i den daglige driften, derfor må en linjeleder eie dem." },
    { q: "Hvorfor er spart tid ikke automatisk en gevinst?", a: ["Fordi tid ikke kan måles", "Fordi noen må bestemme hva den frigjorte tiden skal brukes til", "Fordi KI alltid tar mer tid", "Fordi tid ikke har verdi i offentlig sektor"], c: 1, x: "Frigjort tid blir gevinst først når den brukes bevisst på noe som gir verdi." }
  ]
},
{
  id: 19, part: 5, min: 5, title: "Endringsledelse når KI kommer inn i arbeidshverdagen",
  intro: "I økt 18 så vi at gevinster krever at folk endrer måten de jobber på. Teknologien er ofte den enkle delen. Det vanskelige er mennesker, vaner og kultur. Her ser vi på hvordan du leder endring når KI blir en del av hverdagen.",
  explain: `<p><strong>Endringsledelse</strong> er å hjelpe mennesker fra dagens måte å jobbe på til en ny. Ved innføring av KI er dette særlig viktig, fordi mange kjenner på både nysgjerrighet og usikkerhet: Blir jobben min borte? Kan jeg stole på svarene? Får jeg skylden hvis KI tar feil?</p>
<p>Noen grunnprinsipper:</p>

const KEY = "dskolen.v1";
const fresh = () => ({ xp: 0, done: {}, best: {}, refl: {}, reflXp: {}, badges: {}, streak: 0, bestStreak: 0, last: null, correct: 0 });
let S = (() => { try { const raw = localStorage.getItem(KEY); return raw ? Object.assign(fresh(), JSON.parse(raw)) : fresh(); } catch (e) { return fresh(); } })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const doneCount = s => Object.keys(s.done).length;
const levelOf = xp => { let i = 0; LEVELS.forEach((l, k) => { if (xp >= l.min) i = k; }); const cur = LEVELS[i], nxt = LEVELS[i + 1]; return { i, cur, nxt, pct: nxt ? (xp - cur.min) / (nxt.min - cur.min) : 1 }; };
const lessonById = id => LESSONS.find(l => l.id === id);
const unlocked = id => id === 1 || !!S.done[id - 1];
const currentLesson = () => LESSONS.find(l => !S.done[l.id] && unlocked(l.id));
const partOf = n => PARTS.find(p => p.n === n);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dayKey = d => { const x = d || new Date(); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const maxXp = n => XP.read + n * XP.correct + XP.perfect + XP.reflect;
const liveStreak = () => { if (!S.last) return 0; const y = new Date(); y.setDate(y.getDate() - 1); return (S.last === dayKey() || S.last === dayKey(y)) ? S.streak : 0; };

function touchStreak() {
  const today = dayKey(); if (S.last === today) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  S.streak = S.last === dayKey(y) ? S.streak + 1 : 1;
  S.last = today; S.bestStreak = Math.max(S.bestStreak, S.streak);
}
function checkBadges() {
  const got = [];
  BADGES.forEach(b => { if (!S.badges[b.id] && b.test(S)) { S.badges[b.id] = dayKey(); got.push(b); } });
  return got;
}

        <label for="refl-${id}" class="hint">Skriv noen setninger. Det gir +${XP.reflect} XP første gang, og svaret lagres i refleksjonsloggen din på denne enheten.</label>
        <textarea id="refl-${id}" placeholder="Hos oss ...">${esc(S.refl[id] || "")}</textarea></div></section>
      <section class="card sec"><h2>${ico("arrow")} Neste tema</h2><div class="next-card"><div class="prose"><p>${nxt ? `<strong>Økt ${nxt.id}: ${nxt.title}.</strong> ` : ""}${L.next}</p></div></div></section>
      <div class="finish"><button class="btn gold" id="finish" disabled>${ico("check")} Fullfør økten</button><span class="hint" id="finish-hint">Svar på alle spørsmålene i quizen for å fullføre.</span></div>
    </div></article>`;
  renderQuiz();
  const ta = document.getElementById(`refl-${id}`);
  ta.addEventListener("input", () => { S.refl[id] = ta.value; save(); });
  document.getElementById("finish").addEventListener("click", finishLesson);
}

function renderQuiz() {
  const L = lessonById(Q.id), box = document.getElementById("qbox");
  const answered = Object.keys(Q.ans).length, score = L.quiz.filter((q, i) => Q.ans[i] === q.c).length;
  box.innerHTML = L.quiz.map((q, i) => {
    const a = Q.ans[i];
    return `<div class="q"><p class="q-text">${i + 1}. ${q.q}</p><div class="opts">${q.a.map((o, k) => {
      const cls = a === undefined ? "" : k === q.c ? "right" : k === a ? "wrong" : "";
      return `<button class="opt ${cls}" data-q="${i}" data-k="${k}" ${a !== undefined ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span><span>${o}</span></button>`;
    }).join("")}</div>${a !== undefined ? `<p class="explain" role="status"><strong>${a === q.c ? "Riktig!" : "Ikke helt."}</strong> ${q.x}</p>` : ""}</div>`;
  }).join("") + (answered === L.quiz.length ? `<div class="quiz-score"><span class="num">${score} av ${L.quiz.length} riktige</span><button class="btn ghost" id="retry">Prøv igjen</button></div>` : "");
  box.querySelectorAll(".opt:not([disabled])").forEach(b => b.addEventListener("click", () => { Q.ans[+b.dataset.q] = +b.dataset.k; renderQuiz(); }));
  const r = document.getElementById("retry"); if (r) r.addEventListener("click", () => { Q.ans = {}; renderQuiz(); });
  const f = document.getElementById("finish");
  if (f) { const ok = answered === L.quiz.length; f.disabled = !ok; document.getElementById("finish-hint").textContent = ok ? (S.done[Q.id] ? "Du har fullført før. Nye poeng gis bare for forbedringer." : "Klar! Fullfør for å samle XP.") : "Svar på alle spørsmålene i quizen for å fullføre."; }
}

function finishLesson() {
  const L = lessonById(Q.id), id = Q.id, n = L.quiz.length;
  const score = L.quiz.filter((q, i) => Q.ans[i] === q.c).length;
  const first = !S.done[id], old = S.best[id] || 0, lvBefore = levelOf(S.xp).i;
  const rows = [];
  if (first) rows.push(["Økt lest", XP.read]);
  if (score > old) { rows.push([`Riktige svar (${score - old} nye)`, (score - old) * XP.correct]); S.correct += score - old; }
  if (score === n && old < n) rows.push(["Bonus for feilfri quiz", XP.perfect]);
  const txt = (S.refl[id] || "").trim();
  if (txt.length >= 15 && !S.reflXp[id]) { rows.push(["Refleksjon skrevet", XP.reflect]); S.reflXp[id] = true; }
  const gained = rows.reduce((a, r) => a + r[1], 0);
  S.best[id] = Math.max(old, score);
  S.done[id] = { date: dayKey(), xp: ((S.done[id] && S.done[id].xp) || 0) + gained };
  S.xp += gained; touchStreak();
  const newBadges = checkBadges(); save();
  const lvAfter = levelOf(S.xp);
  const nxt = lessonById(id + 1);
  showModal(`<h2>${score === n ? "Feilfritt!" : "Økt fullført!"}</h2>
    <p class="hint">${score} av ${n} riktige · ${liveStreak()} ${liveStreak() === 1 ? "dag" : "dager"} på rad</p>
    ${rows.length ? `<div class="gain">${rows.map(r => `<div><span>${r[0]}</span><span class="num">+${r[1]} XP</span></div>`).join("")}<div><span>Totalt</span><span class="num">+${gained} XP</span></div></div>` : `<p>Repetisjon styrker læringen. Du har allerede alle poengene for denne økten.</p>`}
    ${lvAfter.i > lvBefore ? `<p><strong>Nytt nivå: ${lvAfter.i + 1} – ${lvAfter.cur.name}!</strong></p>` : ""}
    ${newBadges.length ? `<p class="eyebrow">Nye merker</p><div class="new-badges">${newBadges.map(b => `<div style="display:grid;justify-items:center;gap:4px"><span class="medal">${ico(b.icon, "")}</span><small>${b.name}</small></div>`).join("")}</div>` : ""}
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${nxt ? `<a class="btn" href="#okt-${nxt.id}" data-close>Neste: Økt ${nxt.id} ${ico("arrow")}</a>` : ""}<a class="btn ghost" href="#lop" data-close>Til løpet</a></div>`);
  if (gained || newBadges.length) confetti();
}

/* ---------- Visning: Merker ---------- */
function renderBadges() {
  const n = BADGES.filter(b => S.badges[b.id]).length;
  app.innerHTML = `<h1 class="page-title">Merker</h1><p class="hint" style="margin-top:6px">${n} av ${BADGES.length} merker samlet. Merkene viser hva du har mestret, ikke hvor raskt du gikk.</p>
  <div class="badges">${BADGES.map(b => { const on = !!S.badges[b.id]; return `<div class="badge ${on ? "" : "off"}"><span class="medal">${ico(on ? b.icon : "lock", "")}</span><b>${b.name}</b><small>${b.desc}${on ? `<br>Låst opp ${fmtDate(S.badges[b.id])}` : ""}</small></div>`; }).join("")}</div>`;
}
const fmtDate = k => { const [y, m, d] = k.split("-"); return `${+d}.${+m}.${y}`; };

/* ---------- Visning: Profil ---------- */
function renderProfile() {
  const lv = levelOf(S.xp);
  const refl = LESSONS.filter(l => (S.refl[l.id] || "").trim());
  const all = doneCount(S) >= LESSONS.length;
  const lastDate = all ? Object.values(S.done).map(d => d.date).sort().pop() : null;
  app.innerHTML = `<h1 class="page-title">Din fremgang</h1>
  ${all ? `<section class="cert" aria-label="Kursbevis"><p class="eyebrow">Kursbevis</p><h2>Digitaliseringsskolen fullført</h2><p>Alle ${LESSONS.length} økter i kompetanseløpet om KI, data og digitalisering i offentlig sektor er gjennomført.</p><p class="hint num">${S.xp} XP · nivå ${lv.i + 1}: ${lv.cur.name} · fullført ${fmtDate(lastDate)}</p></section>` : ""}
  <div class="card" style="margin-top:16px;display:flex;align-items:center;gap:14px">${ringSvg(lv.pct, lv.i + 1)}<div style="min-width:0"><span class="lvl-name">${lv.cur.name}</span><p class="hint num">${S.xp} XP${lv.nxt ? ` · ${lv.nxt.min - S.xp} XP til nivå ${lv.i + 2}` : ""}</p></div></div>
  <div class="stats">
    <div class="stat"><b>${doneCount(S)}</b><span>økter fullført</span></div>
    <div class="stat"><b>${S.correct}</b><span>riktige svar</span></div>
    <div class="stat"><b>${liveStreak()}</b><span>dager på rad nå</span></div>
    <div class="stat"><b>${S.bestStreak}</b><span>lengste rekke</span></div>
  </div>
  <section class="block"><h2>Refleksjonsloggen din</h2>${refl.length ? `<div class="journal">${refl.map(l => `<article style="--lc:var(${partOf(l.part).c})"><p class="eyebrow">Økt ${l.id} · ${l.title}</p><p style="margin-top:6px">${esc(S.refl[l.id])}</p></article>`).join("")}</div>` : `<p class="hint">Svarene dine på refleksjonsspørsmålene samles her. Ta dem med til neste teammøte.</p>`}</section>
  <section class="block"><h2>Bruk appen på mobil og PC</h2><div class="install">
    <div><strong>iPhone:</strong> Åpne siden i Safari, trykk på Del-knappen og velg «Legg til på Hjem-skjerm».</div>
    <div><strong>Android:</strong> Åpne siden i Chrome, trykk på menyen (⋮) og velg «Installer app» eller «Legg til på startsiden».</div>
    <div><strong>PC:</strong> I Edge eller Chrome trykker du på installer-ikonet i adressefeltet. Appen fungerer også rett i nettleseren.</div>
    <p class="hint">Fremgangen lagres bare i nettleseren på denne enheten.</p></div></section>
  <section class="block"><h2>Om appen</h2><p class="hint">Læringsinnholdet er lisensiert under <a href="https://creativecommons.org/licenses/by/4.0/deed.no" target="_blank" rel="noopener">CC BY 4.0</a>. Du kan dele og tilpasse det så lenge du oppgir Bjørn-Tore Lund og Digitaliseringsskolen som kilde. Kildekoden er lisensiert under MIT.</p></section>
  <section class="block"><h2>Start på nytt</h2><div class="confirm" id="reset-box"><button class="btn ghost danger" id="reset">Nullstill fremgang</button></div></section>`;
  document.getElementById("reset").addEventListener("click", () => {
    document.getElementById("reset-box").innerHTML = `<span>Alt av XP, merker og refleksjoner på denne enheten slettes.</span><button class="btn ghost" id="no">Avbryt</button><button class="btn" id="yes" style="background:var(--bad);color:var(--surface)">Slett alt</button>`;
    document.getElementById("no").addEventListener("click", renderProfile);
    document.getElementById("yes").addEventListener("click", () => { S = fresh(); save(); toast("Fremgangen er nullstilt"); route(); });
  });
}

/* ---------- Modal, toast, konfetti ---------- */
function showModal(inner) {
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true");
  m.innerHTML = `<div class="card">${inner}</div>`;
  const close = () => m.remove();
  m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) close(); });
  document.addEventListener("keydown", function k(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", k); } });
  document.body.appendChild(m); const f = m.querySelector(".btn"); if (f) f.focus();
}
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d"); cv.hidden = false;
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement), cols = ["--l1", "--l2", "--l3", "--l4", "--l5", "--gold"].map(c => cs.getPropertyValue(c).trim());
  const ps = Array.from({ length: 140 }, () => ({ x: W / 2, y: H * .4, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, a: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
  let t = 0;
  (function f() {
    ctx.clearRect(0, 0, W, H); t++;
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (t < 110) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  })();
}

/* ---------- Ruting ---------- */
function onScroll() {
  const rb = document.getElementById("readbar"); if (rb.hidden) return;
  const h = document.documentElement, max = h.scrollHeight - h.clientHeight;
  rb.firstElementChild.style.width = (max > 0 ? Math.min(100, h.scrollTop / max * 100) : 0) + "%";
}
function route() {
  document.querySelectorAll(".modal").forEach(m => m.remove());
  const v = location.hash.slice(1) || "lop";
  document.getElementById("readbar").hidden = true;
  if (v.startsWith("okt-")) renderLesson(parseInt(v.slice(4), 10));
  else if (v === "merker") renderBadges();
  else if (v === "profil") renderProfile();
  else renderMap();
  renderChrome(v);
  window.scrollTo(0, 0); onScroll();
}
addEventListener("hashchange", route);
addEventListener("scroll", onScroll, { passive: true });
route();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
